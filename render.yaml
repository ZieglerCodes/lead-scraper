# ZERO-DOLLAR MVP OPTION: one Render Free Python API, Supabase Free PostgreSQL+Auth.
# Does not provision a paid worker or an expiring Render Free PostgreSQL DB.
# Short jobs run as best-effort in-process background tasks, with no guarantee
# they survive a service restart/spin-down. Do not use for critical real jobs.
services:
  - type: web
    name: lead-scraper-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DEPLOYMENT_MODE
        value: production
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LEAD_SCRAPER_JOB_MODE
        value: inprocess
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
