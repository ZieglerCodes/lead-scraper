# Render Blueprint. Creates billed web, worker, and PostgreSQL resources.
# Review current Render prices BEFORE confirming creation.
services:
  - type: web
    name: lead-scraper-api
    runtime: python
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DEPLOYMENT_MODE
        value: production
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: lead-scraper-postgres
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
  - type: worker
    name: lead-scraper-worker
    runtime: python
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker
    envVars:
      - key: DEPLOYMENT_MODE
        value: production
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: lead-scraper-postgres
          property: connectionString

databases:
  - name: lead-scraper-postgres
    databaseName: leadscraper
    user: leadscraper
    plan: 0.1c-256mb
    ipAllowList: []
